openapi: 3.0.3
info:
  title: Служебный HTTP API бота «Первый шаг»
  version: 1.1.0
  description: Health-check и входная точка webhook. Пользовательские сценарии работают через официальный MAX Bot API.
servers:
  - url: http://localhost:3000
    description: Локальный запуск
paths:
  /healthz:
    get:
      summary: Проверить готовность процесса
      responses:
        "200":
          description: Процесс готов принимать обновления
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Процесс запускается
  /webhook/{tokenHash}:
    post:
      summary: Принять обновление от MAX
      description: Фактический путь задаётся через WEBHOOK_PATH либо формируется из хеша токена бота.
      parameters:
        - in: path
          name: tokenHash
          required: true
          schema:
            type: string
        - in: header
          name: X-Max-Bot-Api-Secret
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaxUpdate"
      responses:
        "200":
          description: Обновление принято
        "400":
          description: Некорректное тело запроса
        "404":
          description: Неверный путь, HTTP-метод или секрет
components:
  schemas:
    Health:
      type: object
      required: [status, mode]
      properties:
        status:
          type: string
          enum: [ok, starting]
        mode:
          type: string
          enum: [polling, webhook]
    MaxUpdate:
      type: object
      required: [update_type, timestamp]
      properties:
        update_type:
          type: string
          example: message_created
        timestamp:
          type: integer
          format: int64
      additionalProperties: true
