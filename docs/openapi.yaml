openapi: 3.0.3
info:
  title: First Step MAX Bot Runtime API
  version: 1.0.0
  description: HTTP endpoints exposed by the bot container. MAX Bot API calls are made through the official SDK.
servers:
  - url: https://bot.example.com
paths:
  /healthz:
    get:
      summary: Container readiness probe
      responses:
        "200":
          description: Bot runtime is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Bot is starting
  /webhook/{tokenHash}:
    post:
      summary: Receive an update from MAX
      description: The actual path is generated from the bot token unless WEBHOOK_PATH is configured.
      parameters:
        - in: path
          name: tokenHash
          required: true
          schema:
            type: string
        - in: header
          name: X-Max-Bot-Api-Secret
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaxUpdate"
      responses:
        "200":
          description: Update accepted
        "400":
          description: Invalid JSON
        "404":
          description: Wrong path, method, or secret
components:
  schemas:
    Health:
      type: object
      required: [status, mode]
      properties:
        status:
          type: string
          enum: [ok, starting]
        mode:
          type: string
          enum: [polling, webhook]
    MaxUpdate:
      type: object
      required: [update_type, timestamp]
      properties:
        update_type:
          type: string
          example: message_created
        timestamp:
          type: integer
          format: int64
      additionalProperties: true
